name: Publicar no Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preencher o endereco do site
        env:
          PROJETO: ${{ secrets.FIREBASE_PROJECT_ID }}
          DOMINIO_PROPRIO: ${{ vars.DOMINIO }}
        run: |
          DOMINIO="${DOMINIO_PROPRIO:-${PROJETO}.web.app}"
          echo "Publicando em https://$DOMINIO"
          sed -i "s|__DOMINIO__|$DOMINIO|g" public/index.html
          grep -c "$DOMINIO" public/index.html

      - name: Publicar
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live
